<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یادنامه و نقشه آرامستان یوجان</title>
  
  <!-- CSS برای نقشه Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- CSS برای نمایش عکس ۳۶۰ درجه Pannellum -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f4f9; direction: rtl; }
    
    header {
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .search-container {
      margin: 15px auto;
      max-width: 500px;
      padding: 0 10px;
    }

    .search-container input {
      width: 100%;
      padding: 12px;
      border: 2px solid #3498db;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    #map {
      height: 520px;
      width: 95%;
      margin: 0 auto 20px auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #modal-360 {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
    }

    #panorama {
      width: 100%;
      height: 90%;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      color: white;
      font-size: 30px;
      cursor: pointer;
      z-index: 10000;
      background: #e74c3c;
      padding: 2px 15px;
      border-radius: 5px;
    }

    .popup-card {
      text-align: center;
      max-width: 220px;
    }
    .popup-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .nav-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-360 {
      background: #2ecc71;
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h2>یادنامه و نقشه آرامستان یوجان</h2>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="نام یا نام خانوادگی متوفی را سرچ کنید..." onkeyup="searchGrave()">
  </div>

  <div id="map"></div>

  <div id="modal-360">
    <span class="close-btn" onclick="close360()">× بستن</span>
    <div id="panorama"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <script>
    // لیست قبرها (نمونه اولیه - بعداً با اطلاعات واقعی شما جایگزین می‌شود)
    const graves = [
      {
        id: 1,
        name: "مرحوم غلامی (نمونه)",
        dates: "۱۳۱۵ - ۱۴۰۱",
        coords: [33.717453, 50.165419],
        image: "https://via.placeholder.com/200x150?text=Grave+Sample",
        panoUrl: "https://pannellum.org/images/alma.jpg"
      }
    ];

    // مرکز نقشه دقیقاً روی آرامستان یوجان
    const map = L.map('map').setView([33.717453, 50.165419], 18);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri Satellite Map'
    }).addTo(map);

    let markers = {};

    function loadGraves() {
      graves.forEach((grave, index) => {
        const marker = L.marker(grave.coords).addTo(map);
        
        const prevId = index > 0 ? index - 1 : graves.length - 1;
        const nextId = index < graves.length - 1 ? index + 1 : 0;

        const popupContent = `
          <div class="popup-card">
            <h4>${grave.name}</h4>
            <p style="margin:4px 0; font-size:12px;">سال: ${grave.dates}</p>
            <img src="${grave.image}" alt="${grave.name}">
            <button class="btn btn-360" onclick="open360('${grave.panoUrl}')">🌐 دیدن عکس ۳۶۰ درجه</button>
            <div class="nav-btns">
              <button class="btn" onclick="goToGrave(${prevId})">👈 قبلی</button>
              <button class="btn" onclick="goToGrave(${nextId})">بعدی 👉</button>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markers[index] = marker;
      });
    }

    loadGraves();

    function goToGrave(index) {
      const grave = graves[index];
      map.setView(grave.coords, 19);
      markers[index].openPopup();
    }

    function searchGrave() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const foundIndex = graves.findIndex(g => g.name.toLowerCase().includes(query));
      
      if (foundIndex !== -1 && query.trim() !== "") {
        goToGrave(foundIndex);
      }
    }

    let viewer = null;
    function open360(panoUrl) {
      document.getElementById('modal-360').style.display = 'block';
      if (viewer) viewer.destroy();
      
      viewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": panoUrl,
        "autoLoad": true
      });
    }

    function close360() {
      document.getElementById('modal-360').style.display = 'none';
    }
  </script>
</body>
</html>
